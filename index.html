<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#fff3ee" />
    <meta
      name="description"
      content="China & Japan trip itinerary — Autumn 2026"
    />
    <title>China · Japan — Itinerary</title>

    <!-- PWA: installable + offline -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icons/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/icons/favicon-16.png"
    />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="CN·JP Trip" />

    <!-- Local title, heading and body fonts, with lightweight web fallbacks. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css?v=65" />
  </head>
  <body>
    <div class="app">
      <header class="masthead">
        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
        ></button>
        <img
          src="assets/photos/food.png"
          alt="Chinese and Japanese food"
          class="trip-food-banner"
        />
        <h1 id="tripTitle">China &amp; Japan</h1>
        <p class="trip-subtitle">Travel Itinerary</p>
        <div class="daterange" id="tripRange"></div>
        <div class="fx" id="fxChip" hidden></div>
      </header>

      <main>
        <section id="panel-days" class="panel active"></section>
        <section id="panel-book" class="panel"></section>
        <section id="panel-buy" class="panel"></section>
        <section id="panel-travel" class="panel"></section>
        <section id="panel-camera" class="panel"></section>
        <section id="panel-packing" class="panel"></section>
        <section id="panel-more" class="panel"></section>
      </main>
    </div>

    <nav class="tabbar" aria-label="Trip tools">
      <div class="inner">
        <button type="button" class="tab active" data-target="days">
          <span class="ic"></span><span>Days</span>
        </button>
        <button type="button" class="tab" data-target="book">
          <span class="ic"></span><span>To Book</span>
        </button>
        <button type="button" class="tab" data-target="buy">
          <span class="ic"></span><span>To Buy</span>
        </button>
        <button type="button" class="tab" data-target="travel">
          <span class="ic"></span><span>Travel</span>
        </button>
        <button type="button" class="tab" data-target="camera">
          <span class="ic"></span><span>Camera</span>
        </button>
        <button type="button" class="tab" data-target="packing">
          <span class="ic"></span><span>Packing</span>
        </button>
        <button type="button" class="tab" data-target="more">
          <span class="ic"></span><span>More</span>
        </button>
      </div>
    </nav>

    <script src="js/data.js?v=20"></script>
    <script src="js/app.js?v=50"></script>
  </body>
</html>
